[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulacra-and-simulation"
version = "0.1.0"
description = "Dual-track Codex vs Codex plus WorkerBee simulation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
simctl = "simulacra.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["simulacra"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
